[project]
name = "rao"
version = "0.2.0"
description = "Baltic RCC RAO implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elasticsearch==9.5.1",
    "loguru>=0.8.0",
    "minio>=7.2.20",
    "ndjson>=0.3.1",
    "pandas>=3.1.1",
    "pika>=1.5.0",
    "pip>=26.3",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypowsybl>=1.16.1",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
    "setuptools>=84.2.1",
    "triplets>=0.2.0",
    "typing-extensions>=4.13.2",
    "uv>=0.13.9",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "local-pypi"
url = "https://artifactory.elering.sise/artifactory/api/pypi/pssepip/simple"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
#default = true

[tool.uv]
allow-insecure-host = ["artifactory.elering.sise"]

[tool.pytest.ini_options]
pythonpath = ["."]
