# Remedial action costs for the CRAC (rao.crac.costs), used by the MIN_COST objective.
# Keyed by remedial action id or name. activationCost applies to every remedial action,
# variationCosts (EUR/MW) to range actions only. A missing activationCost falls back to the
# action type cost in 'activationCosts', other missing values to 'defaults'.
activationCosts:              # EUR per activation per type, cheapest first (built-in values shown)
  topologyUpAndDown: 1.0      # topology action with 'upAndDown' range (id and id + '-opposite-direction')
  networkAction: 10.0
  countertrade: 100.0
  redispatch: 1000.0
defaults:
  variationCosts:
    up: 50.0                  # EUR/MW
    down: 50.0                # EUR/MW
remedialActions:
  RA_RD_KHES_G5:              # redispatch unit (injection range action)
    activationCost: 100.0
    variationCosts: {up: 50.0, down: 50.0}
  RA_RD_PHES_G1:
    variationCosts: {up: 45.0, down: 40.0}
  RA_LN316LV:                 # topological network action, by name (or by mRID)
    activationCost: 20.0
