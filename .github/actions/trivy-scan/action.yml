name: Trivy image scan
description: Scan a local image with Trivy and print a table to the log. Optionally upload SARIF to the Security tab and/or fail on fixable critical vulnerabilities.

inputs:
  image-ref:
    description: Image to scan, must already be loaded in the local Docker
    required: true
  category:
    description: SARIF category, one per image so results don't overwrite each other
    required: true
  upload-sarif:
    description: Upload SARIF results to the GitHub Security tab (only meaningful for the default branch)
    required: false
    default: 'false'
  gate:
    description: Fail the step when fixable CRITICAL vulnerabilities are found. Accepted risks go to .trivyignore
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Run Trivy vulnerability scanner for table
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      continue-on-error: true
      with:
        image-ref: ${{ inputs.image-ref }}
        vuln-type: 'os,library'
        format: 'table'
        severity: 'CRITICAL,HIGH'

    - name: Run Trivy vulnerability scanner for security tab
      if: inputs.upload-sarif == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      continue-on-error: true
      with:
        image-ref: ${{ inputs.image-ref }}
        vuln-type: 'os,library'
        format: 'sarif'
        output: '${{ inputs.category }}.sarif'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        limit-severities-for-sarif: true

    - name: Upload Trivy scan results to GitHub Security tab
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      continue-on-error: true
      with:
        sarif_file: '${{ inputs.category }}.sarif'
        category: ${{ inputs.category }}
        sha: ${{ github.sha }}
        ref: ${{ github.ref }}

    - name: Fail on fixable critical vulnerabilities
      if: inputs.gate == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        vuln-type: 'os,library'
        format: 'table'
        severity: 'CRITICAL'
        ignore-unfixed: true
        exit-code: '1'
