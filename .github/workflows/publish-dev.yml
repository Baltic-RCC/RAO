name: Publish test build

# On-demand images from any branch for testing in your own infrastructure before a release:
# Actions -> "Publish test build" -> Run workflow -> pick the branch.
#
# Published per image:
#   dev-<branch>   moves with every run on that branch (slashes etc. become "-", e.g. feature/x -> dev-feature-x)
#   sha-<7 chars>  the exact commit
# Never touches edge, latest or any version tag. Same attestations as a release, so what you test has the same shape.

on:
  workflow_dispatch:

concurrency:
  group: publish-dev-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.DOCKER_USERNAME || 'balticrcc' }}
  GIT_SHA: ${{ github.sha }}

jobs:
  publish:
    name: Build, smoke test, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute tags and build metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Run this workflow on a branch; versions are released by pushing a vX.Y.Z tag (see RELEASING.md)"
            exit 1
          fi
          if [[ ! -f docker-bake.hcl ]]; then
            echo "::error::Branch $GITHUB_REF_NAME has no docker-bake.hcl, merge or rebase main into it first"
            exit 1
          fi

          # docker tag rules: [a-z0-9._-], max 128 chars, no leading "." or "-"; the dev- prefix also
          # makes it impossible for a branch name to collide with a release tag like 1.4.0 or latest
          SLUG=$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REF_NAME" | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-.]+//; s/-+$//' | cut -c1-100)
          SHORT="${GIT_SHA::7}"
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          echo "APP_VERSION=${VERSION}-dev+${SHORT}" >> "$GITHUB_ENV"
          echo "TAGS=dev-${SLUG},sha-${SHORT}" >> "$GITHUB_ENV"
          echo "SHORT_TAG=sha-${SHORT}" >> "$GITHUB_ENV"

      # Build first without pushing and smoke test what is about to be published
      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: |
            docker-bake.hcl
            .github/docker-bake.ci.hcl
          targets: default
          load: true

      - name: Smoke test images
        run: bash scripts/smoke_images.sh "$SHORT_TAG" "$REGISTRY"
        env:
          EXPECTED_VERSION: ${{ env.APP_VERSION }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: |
            docker-bake.hcl
            .github/docker-bake.ci.hcl
          targets: default
          push: true
          sbom: true
          provenance: mode=max

      - name: Summary
        run: |
          {
            echo "### Published test images"
            for tag in ${TAGS//,/ }; do
              echo "- \`${REGISTRY}/rao-input-retriever:${tag}\`"
              echo "- \`${REGISTRY}/rao:${tag}\`"
            done
            echo
            echo "Version inside the images: \`${APP_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
