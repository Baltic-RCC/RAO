name: Build and publish snapshot

permissions:
  contents: read
  security-events: write

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release (e.g., v1.0.0)'
        required: true

jobs:
  build-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Variables
        run: |
          echo "INPUT_RETRIEVER_PROJECT=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-input-retriever" >> $GITHUB_ENV
          echo "RAO_PROJECT=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "DATE_TAG=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "LATEST_TAG=latest" >> $GITHUB_ENV

      - name: Compute IMAGE_TAG
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # manual run: use the provided version
            TAG="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # tag push: use the tag name
            TAG="${GITHUB_REF_NAME}"
          else
            # branch push: snap-<sha> (change to "${GITHUB_REF_NAME}" if you prefer)
            TAG="snap-${{ env.DATE_TAG }}"
          fi

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Computed IMAGE_TAG=$TAG"

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: input_retriever/Dockerfile
          load: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/${{ env.INPUT_RETRIEVER_PROJECT }}:${{ env.IMAGE_TAG }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.INPUT_RETRIEVER_PROJECT }}:${{ env.LATEST_TAG }}

      - name: Scan input-retriever image
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ vars.DOCKER_USERNAME }}/${{ env.INPUT_RETRIEVER_PROJECT }}:${{ env.IMAGE_TAG }}
          category: trivy-input-retriever

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: rao/Dockerfile
          load: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/${{ env.RAO_PROJECT }}:${{ env.IMAGE_TAG }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.RAO_PROJECT }}:${{ env.LATEST_TAG }}

      - name: Scan optimizer image
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ vars.DOCKER_USERNAME }}/${{ env.RAO_PROJECT }}:${{ env.IMAGE_TAG }}
          category: trivy-optimizer

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push images
        run: |
          docker push --all-tags ${{ vars.DOCKER_USERNAME }}/${{ env.INPUT_RETRIEVER_PROJECT }}
          docker push --all-tags ${{ vars.DOCKER_USERNAME }}/${{ env.RAO_PROJECT }}
